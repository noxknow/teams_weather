# 저장 위치: .github/workflows/weather.yml
name: Teams 아침 날씨 알림

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 날씨 전송
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WEATHER_LAT: "37.545040"
          WEATHER_LON: "127.055124"
          WEATHER_LOCATION: "성수"
        run: python weather_to_teams.py
