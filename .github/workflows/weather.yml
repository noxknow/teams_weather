# 저장 위치: .github/workflows/weather.yml
name: Teams 아침 날씨 알림

on:
  schedule:
    # 22:17 UTC = 한국 시간 07:17, UTC 일~목 = 한국 월~금
    - cron: "17 22 * * 0-4"
    # 테스트용: 오늘(11/18) 10:05 KST 한 번. 확인 후 이 줄 삭제
    - cron: "5 1 18 11 *"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 날씨 전송
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WEATHER_LAT: "37.545040"
          WEATHER_LON: "127.055124"
          WEATHER_LOCATION: "성수"
        run: python weather_to_teams.py
