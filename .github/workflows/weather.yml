# 저장 위치: .github/workflows/weather.yml
name: Teams 아침 날씨 알림

on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 22:30 UTC = 한국 시간 07:30
    - cron: "30 22 * * *"
  workflow_dispatch: # 수동 실행(테스트용)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 날씨 전송
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          WEATHER_LAT: "37.544581"
          WEATHER_LON: "127.055961"
          WEATHER_LOCATION: "서울"
        run: python weather_to_teams.py
